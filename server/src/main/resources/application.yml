spring:

  data:
    redis:
      repositories:
        enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          debug: true
          auth: true
          connectiontimeout: 5000
          starttls:
            enable: true

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET_NAME}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}

  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}

bannabe:
  default-profile-image: ${DEFAULT_PROFILE_IMAGE_URL}
  payment:
    api-key: ${PAYMENT_API_KEY}
    secret-key: ${PAYMENT_SECRET_KEY}

encrypt:
  password: ${JASYPT_PASSWORD}