spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bannabe
    username: server
    password: 1234

  data:
    redis:
      host: localhost
      port: 6379
      password: 1234

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        highlight_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always